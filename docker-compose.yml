# A whole platform on one machine, for a demonstration or a first deployment.
#
# The three roles are three connection strings, not three databases: rule 12 wants the
# owner and the application to be different roles, so the compose file passes different
# users of the same database rather than pretending one user is enough.
#
# Every long running service restarts unless somebody stopped it (SEC-07). A process that
# dies at three in the morning and stays dead until a person notices is the failure this
# platform can least afford: the worker is what destroys data on time, delivers callbacks
# and watches for changes, and none of that says anything when it is not running.
#
# **Every variable a service needs is named in its own `environment:` block**, rather than
# handed over wholesale with `env_file`. Two reasons, and the second is why this file changed.
#
# It says what each process actually reads. The worker needs three connection strings and the
# API needs one, and a reader should not have to open four packages to learn that.
#
# And a deployment tool manages the environment itself. Coolify writes its own `.env` and
# interpolates `${...}` from it, but does not necessarily honour an `env_file:` directive
# pointing at that same file. A service that loaded nothing came up with no database url at
# all and restarted until the deployment timed out, which reads as a hang rather than as a
# missing variable. Interpolation works under both.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${NX_POSTGRES_PASSWORD:?set NX_POSTGRES_PASSWORD}
      POSTGRES_DB: nx_verify
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nx_verify']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    # No restart policy: it runs once and finishing is what it is for. It makes the root key
    # before it migrates, because everything sealed afterwards is sealed under it.
    command:
      - sh
      - -c
      - >-
        node scripts/ensure-master-key.mjs &&
        pnpm --filter @nx-verify/db run migrate up
    environment:
      # The owner connection: it creates the roles and owns the tables, and nothing else in
      # this file uses it (rule 12).
      NX_ADMIN_DATABASE_URL: ${NX_ADMIN_DATABASE_URL:?set NX_ADMIN_DATABASE_URL}
      # The migrate runner assigns these to the roles migration 0001 creates.
      NX_MIGRATOR_PASSWORD: ${NX_MIGRATOR_PASSWORD:-}
      NX_APP_PASSWORD: ${NX_APP_PASSWORD:-}
      NX_RETENTION_PASSWORD: ${NX_RETENTION_PASSWORD:-}
      NX_OPERATOR_PASSWORD: ${NX_OPERATOR_PASSWORD:-}
      NX_MASTER_KEY_FILE: /var/lib/nx-keys/master
    volumes:
      - keys:/var/lib/nx-keys
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    command: ['pnpm', '--filter', '@nx-verify/api', 'run', 'start']
    environment:
      # One connection, and it owns nothing and never bypasses row level security (rule 12).
      NX_APP_DATABASE_URL: ${NX_APP_DATABASE_URL:?set NX_APP_DATABASE_URL}
      NX_PROVIDERS: ${NX_PROVIDERS:-stub}
      NX_OPENBANKING_PROVIDERS: ${NX_OPENBANKING_PROVIDERS:-}
      # Printed on every sealed document, as the address its code is checked at.
      NX_PUBLIC_BASE_URL: ${NX_PUBLIC_BASE_URL:-}
      NX_CONSOLE_BASE_URL: ${NX_CONSOLE_BASE_URL:-}
      # A key service where there is one. Set these and the key file below is ignored.
      NX_KMS_ENDPOINT: ${NX_KMS_ENDPOINT:-}
      NX_KMS_TOKEN: ${NX_KMS_TOKEN:-}
      NX_KMS_KEYS: ${NX_KMS_KEYS:-}
      # Connection secrets set from the administration panel, sealed on a shared volume
      # and never in the database (rule 10, ADR-108).
      NX_SECRETS_FILE: /var/lib/nx-secrets/connections.sealed
      # The root key those are sealed under. A file rather than a variable, because a
      # variable is readable by anything that can run `docker inspect` (ADR-151). A key
      # service is better where there is one: set NX_KMS_ENDPOINT instead and this is ignored.
      NX_MASTER_KEY_FILE: /var/lib/nx-keys/master
    volumes:
      - secrets:/var/lib/nx-secrets
      - keys:/var/lib/nx-keys
    ports:
      # The host port is a variable because a server that already runs something on 3000
      # fails to start with «port is already allocated», and that is a one word fix rather
      # than an edit to this file.
      - '${NX_API_HOST_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Readiness, not liveness: an instance that cannot reach the database must not be
      # sent traffic, and restarting it would not help.
      # 127.0.0.1, not localhost: inside the container localhost resolves to ::1 first,
      # the server binds IPv4, and the check reports a healthy API as unhealthy.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/ready']
      interval: 10s
      timeout: 5s
      retries: 6

  console:
    build: .
    restart: unless-stopped
    command: ['pnpm', '--filter', '@nx-verify/console', 'run', 'start']
    environment:
      NX_APP_DATABASE_URL: ${NX_APP_DATABASE_URL:?set NX_APP_DATABASE_URL}
      # The panel reads a second connection, on a role that can see no subscriber's data.
      NX_OPERATOR_DATABASE_URL: ${NX_OPERATOR_DATABASE_URL:?set NX_OPERATOR_DATABASE_URL}
      # Without it there is no way into the panel at all (SEC-06).
      NX_OPERATOR_TOKEN: ${NX_OPERATOR_TOKEN:?set NX_OPERATOR_TOKEN}
      NX_PROVIDERS: ${NX_PROVIDERS:-stub}
      NX_CONSOLE_URL: ${NX_CONSOLE_URL:-}
      NX_CONSOLE_BASE_URL: ${NX_CONSOLE_BASE_URL:-}
      NX_PUBLIC_BASE_URL: ${NX_PUBLIC_BASE_URL:-}
      NX_SUPPORT_EMAIL: ${NX_SUPPORT_EMAIL:-}
      # Where a subscriber transfers to. Unset, the billing screen says so rather than
      # printing an account that is not ours.
      NX_BANK_ACCOUNT_NAME: ${NX_BANK_ACCOUNT_NAME:-}
      NX_BANK_NAME: ${NX_BANK_NAME:-}
      NX_BANK_IBAN: ${NX_BANK_IBAN:-}
      NX_KMS_ENDPOINT: ${NX_KMS_ENDPOINT:-}
      NX_KMS_TOKEN: ${NX_KMS_TOKEN:-}
      NX_KMS_KEYS: ${NX_KMS_KEYS:-}
      # Connection secrets set from the administration panel, sealed on a shared volume
      # and never in the database (rule 10, ADR-108).
      NX_SECRETS_FILE: /var/lib/nx-secrets/connections.sealed
      NX_MASTER_KEY_FILE: /var/lib/nx-keys/master
    volumes:
      - secrets:/var/lib/nx-secrets
      - keys:/var/lib/nx-keys
    ports:
      - '${NX_CONSOLE_HOST_PORT:-3001}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    restart: unless-stopped
    command: ['pnpm', '--filter', '@nx-verify/worker', 'run', 'start']
    environment:
      # Three connections, because the worker does three different jobs: the application's
      # work, the operator's list of workspaces, and the one role that may delete (ADR-056).
      NX_APP_DATABASE_URL: ${NX_APP_DATABASE_URL:?set NX_APP_DATABASE_URL}
      NX_OPERATOR_DATABASE_URL: ${NX_OPERATOR_DATABASE_URL:?set NX_OPERATOR_DATABASE_URL}
      NX_RETENTION_DATABASE_URL: ${NX_RETENTION_DATABASE_URL:?set NX_RETENTION_DATABASE_URL}
      # The first owner of the panel, made true at every start (ADR-142).
      NX_PANEL_OWNER_EMAIL: ${NX_PANEL_OWNER_EMAIL:-}
      NX_PANEL_OWNER_PASSWORD: ${NX_PANEL_OWNER_PASSWORD:-}
      NX_PANEL_OWNER_NAME: ${NX_PANEL_OWNER_NAME:-}
      NX_PROVIDERS: ${NX_PROVIDERS:-stub}
      NX_OPENBANKING_PROVIDERS: ${NX_OPENBANKING_PROVIDERS:-}
      NX_CONSOLE_URL: ${NX_CONSOLE_URL:-}
      NX_PUBLIC_BASE_URL: ${NX_PUBLIC_BASE_URL:-}
      NX_KMS_ENDPOINT: ${NX_KMS_ENDPOINT:-}
      NX_KMS_TOKEN: ${NX_KMS_TOKEN:-}
      NX_KMS_KEYS: ${NX_KMS_KEYS:-}
      NX_SECRETS_FILE: /var/lib/nx-secrets/connections.sealed
      NX_MASTER_KEY_FILE: /var/lib/nx-keys/master
      # Touched after every sweep, and read by the health check below (SEC-07).
      NX_WORKER_HEARTBEAT: /tmp/nx-worker-heartbeat
    volumes:
      - secrets:/var/lib/nx-secrets
      - keys:/var/lib/nx-keys
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The worker answers no port: proving it is alive must not add a surface to the one
      # process that holds the role which may delete. It reads the age of the heartbeat
      # instead, so a loop that has stopped is caught without asking the database anything.
      test: ['CMD', 'pnpm', '--filter', '@nx-verify/worker', 'run', 'health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  db:
  # Sealed connection secrets. Back it up separately from the database, and never
  # together with the master key.
  secrets:
  # The root key everything above is sealed under. **Back this up somewhere else again**:
  # together with `secrets` it is the plaintext, and together with `db` it is every
  # identifier this platform holds. Losing it alone loses every provider credential and
  # every stored identifier, and no backup of the other two brings them back.
  keys:
